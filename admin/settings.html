<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="./css/settings.css">
    <link rel="stylesheet" href="./css/top-bar.css">
    <link rel="stylesheet" href="./css/side-bar.css">
    <link rel="icon" type="image/svg" href="./assets/admin-panel/favicon/settings.svg">
</head>
<body hidden>
    <div id="top-bar-container"></div>
    <div id="dashboard-body">
        <div id="sidebar-container"></div>
        <div id="main-container">
            <div class="outer-card">
                <span id="title-container">
                    <img id="title-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-left-white.svg">
                    <p id="title">Settings</p>
                </span>
                <a class="inner-cards top-inner-card" href="./account-settings.html">
                    <p class="card-title">Account Settings</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </a>
                <button type="button" class="inner-cards" id="theme-toggle" aria-expanded="false" aria-controls="theme-panel">
                    <p class="card-title">Theme</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </button>
                <div class="option-panel" id="theme-panel" hidden>
                    <div class="choice-row" role="group" aria-label="Theme">
                        <button type="button" class="choice" data-theme="light">Light</button>
                        <button type="button" class="choice" data-theme="dark">Dark</button>
                        <button type="button" class="choice" data-theme="system">Match device</button>
                    </div>
                </div>
                <button type="button" class="inner-cards" id="a11y-toggle" aria-expanded="false" aria-controls="a11y-panel">
                    <p class="card-title">Accessibility</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </button>
                <div class="option-panel" id="a11y-panel" hidden>
                    <label class="switch-row"><input type="checkbox" data-pref="largeText"> Larger text</label>
                    <label class="switch-row"><input type="checkbox" data-pref="highContrast"> High contrast</label>
                    <label class="switch-row"><input type="checkbox" data-pref="reduceMotion"> Reduce motion</label>
                </div>
                <button type="button" class="inner-cards bottom-inner-card" id="reset-settings">
                    <p class="card-title">Reset to defaults</p>
                </button>
                <p id="settings-note" role="status" aria-live="polite"></p>
            </div>
        </div>
    </div>
    <script type="module" src="./js/shell.js"></script>
    <script type="module" src="./js/settings-page.js"></script>
</body>
</html>
